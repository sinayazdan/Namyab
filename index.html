<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نام‌یاب | جستجوی اسم شماره تلفن</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn','Tahoma',sans-serif;background:#fafafa;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px}
h1{font-size:28px;margin-bottom:6px}
.sub{color:#666;font-size:14px;margin-bottom:28px}
.panel{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:24px;width:100%;max-width:480px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
form{display:flex;gap:10px;flex-direction:column}
input{font-size:18px;padding:14px;border:1.5px solid #ddd;border-radius:12px;direction:ltr;text-align:left;width:100%;font-family:monospace}
input:focus{outline:none;border-color:#1a1a1a}
button{background:#1a1a1a;color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;cursor:pointer;font-family:inherit}
button:disabled{opacity:.5;cursor:default}
.error{background:#fde8e8;color:#b00;border-radius:10px;padding:12px;margin-top:14px;font-size:14px}
.results{margin-top:18px}
.name-row{background:#f5f5f5;border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:16px}
.name-row .count{color:#888;font-size:12px;margin-right:8px}
.hint{margin-top:16px;font-size:12px;color:#999;text-align:center}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<h1>📞 نام‌یاب</h1>
<p class="sub">ببین بقیه این شماره رو با چه اسمی ذخیره کردن</p>
<div class="panel">
<form id="f">
<input id="phone" type="tel" inputmode="tel" placeholder="+989123456789" autocomplete="off" maxlength="16">
<button id="btn" type="submit">جستجو</button>
</form>
<div id="err"></div>
<div id="res" class="results"></div>
</div>
<p class="hint">شماره رو با کد کشور وارد کن (مثلاً +98 برای ایران)</p>
<script>
const f=document.getElementById('f'),ph=document.getElementById('phone'),
      btn=document.getElementById('btn'),err=document.getElementById('err'),res=document.getElementById('res');
ph.addEventListener('input',e=>{
  let v=e.target.value.replace(/[^\d+]/g,'');
  let plus=v.startsWith('+');
  v=(plus?'+':'')+v.replace(/\+/g,'');
  if(e.target.value!==v)e.target.value=v;
});
f.addEventListener('submit',async e=>{
  e.preventDefault();
  err.innerHTML='';res.innerHTML='';
  let p=ph.value.trim();
  if(!p.startsWith('+')){err.innerHTML='<div class="error">شماره باید با کد کشور شروع بشه (مثل +98912...)</div>';return;}
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> در حال جستجو…';
  try{
    const r=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:p})});
    const d=await r.json();
    if(!r.ok||!d.status){err.innerHTML='<div class="error">'+(d.error||'نتیجه‌ای پیدا نشد')+'</div>';}
    else{
      const names=d.result||[];
      if(Array.isArray(names)&&names.length){
        res.innerHTML='<div style="margin-bottom:10px;color:#666;font-size:14px">'+names.length+' اسم پیدا شد:</div>'+names.map(n=>{
          const full=((n.name||'')+' '+(n.last_name||'')).trim()||'(بدون اسم)';
          return '<div class="name-row">'+escapeHtml(full)+'</div>';
        }).join('');
      }else{
        err.innerHTML='<div class="error">نتیجه‌ای پیدا نشد</div>';
      }
    }
  }catch{err.innerHTML='<div class="error">خطای شبکه</div>';}
  btn.disabled=false;btn.textContent='جستجو';
});
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
ph.focus();
</script>
</body>
</html>

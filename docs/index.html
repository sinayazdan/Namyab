<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نام‌یاب | جستجوی اسم شماره تلفن</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn','Tahoma',sans-serif;background:#fafafa;color:#1a1a1a;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px}
h1{font-size:28px;margin-bottom:6px}
.sub{color:#666;font-size:14px;margin-bottom:28px}
.panel{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:24px;width:100%;max-width:480px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
form{display:flex;gap:10px;flex-direction:column}
input{font-size:18px;padding:14px;border:1.5px solid #ddd;border-radius:12px;direction:ltr;text-align:left;width:100%;font-family:monospace}
input:focus{outline:none;border-color:#1a1a1a}
button{background:#1a1a1a;color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;cursor:pointer;font-family:inherit}
button:disabled{opacity:.5;cursor:default}
.error{background:#fde8e8;color:#b00;border-radius:10px;padding:12px;margin-top:14px;font-size:14px}
.results{margin-top:18px}
.name-row{background:#f5f5f5;border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:16px}
.hint{margin-top:16px;font-size:12px;color:#999;text-align:center}
.src{margin-top:24px;font-size:12px;color:#aaa}
.src a{color:#888}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<h1>📞 نام‌یاب</h1>
<p class="sub">ببین بقیه این شماره رو با چه اسمی ذخیره کردن</p>
<div class="panel">
<form id="f">
<input id="phone" type="tel" inputmode="tel" placeholder="+989123456789" autocomplete="off" maxlength="16">
<button id="btn" type="submit">جستجو</button>
</form>
<div id="err"></div>
<div id="res" class="results"></div>
</div>
<p class="hint">شماره رو با کد کشور وارد کن (مثلاً +98 برای ایران)</p>
<p class="src"><a href="https://github.com/sinayazdan/Namyab" target="_blank">سورس در گیت‌هاب</a></p>
<script>
// --- Crypto (Web Crypto API port of the Android app protocol) ---
const K128=hex('b2c0d351067184fe'),IV128=hex('7ae8be8095cbf86f22376ca61b516a5f'),
      K256=hex('8f434346648f6a94df89dda901c5176b10a6d83960dd3b1ac88b59b2dc327aa4'),
      IV256=hex('000102030405060708090a0b0c0d0e0f'),
      FILE_SIZE='52256768',
      CERT_B64='MIIFiDCCA3CgAwIBAgIUUed1LZl3xGrmH2Rg/E9lqFpsaxQwDQYJKoZIhvcNAQELBQAwdDELMAkGA1UEBhMCVVMxEzARBgNVBAgTCkNhbGlmb3JuaWExFjAUBgNVBAcTDU1vdW50YWluIFZpZXcxFDASBgNVBAoTC0dvb2dsZSBJbmMuMRAwDgYDVQQLEwdBbmRyb2lkMRAwDgYDVQQDEwdBbmRyb2lkMCAXDTIzMDIxMDEzMDUyNloYDzIwNTMwMjEwMTMwNTI2WjB0MQswCQYDVQQGEwJVUzETMBEGA1UECBMKQ2FsaWZvcm5pYTEWMBQGA1UEBxMNTW91bnRhaW4gVmlldzEUMBIGA1UEChMLR29vZ2xlIEluYy4xEDAOBgNVBAsTB0FuZHJvaWQxEDAOBgNVBAMTB0FuZHJvaWQwggIiMA0GCSqGSIb3DQEBAQUAA4ICDwAwggIKAoICAQCZcbVl7AYHUadYakWin2LV9lqcT2ljLKLYiDApMPiV+0kn2utulJAYxncBbdfwnajOwNjr13wGpbfR+hVOL2pXa4nZ10Y/Yq9hfaFTAKwmQ0qIWzN1Q7HstK1sq/0tRtslI7cFvlR2hiOZS8wy4uJa9FQuFxaDdTe2nnzV48HcRxDwoWcaNq5rBsb826rfruGA+/OYoQ/fwxNFIx+ZIkmJG5WAYlDbGnOj2jmWxKb8NuTPBjAcZjHq/xkTXEBEnSJbTL7ZVhc4mqHhTL/g8O/fiBh7sxX44QUXbTfzU+fw8fG16URudc8aRJuSe07l9AVbe0u5AurOYcTuLS00FzzUV0Iuq/SWRVyHRfHtXWCBNrx+4D6mbhSQBvSRADogqH/ko99dnk8s1jeiRupBvcthf3A+CoiBbiEIhB1M11ATKyUBloB2pajL/jAKd4m8mP7ogZpENxEUO7e9P2DRh3qQSajSxvSk2jslKl7EeVqa+GJFmMWLsX+aWEqSJPNqDvhlWHgLkadJ+DWC+k087F7s1n/gpIGmD4tnl5H5L8H6YDuvM20G0smyK+PjTP+jSzOFtz/FSPdIsLZJSYVjNETE/g/xpaRaFc8wTyf8BPw0xopOCBWfhsHinl/nK2PcvTly5YSs4DLpiN62miMVTilsyEYpWP9GZnVwW0A2QE4X7wIDAQABoxAwDjAMBgNVHRMEBTADAQH/MA0GCSqGSIb3DQEBCwUAA4ICAQBd/gK/eB2lqpT4WWtvsHcIhGY8eHyaaP/NctGuWJPFZtB0GLQpZSA2+j8RILat3f4rvjdnkpZWHG2kQH9X8l/BykQSwNx/uyyXWGPKY0NW7XyiVDQfazjG+HOXAZ867Lk1NNzVUXnHKyWZLFzpfgznboyzzyJvFT+3mCjqUf3lKeSBjQhphnnw8dKbSxlhJB21B+IvGo8ne2nqHGRs+ukhbJc3jwh3Z1xnR35ROe3HHA0FvEcmj1NJ5fOepXnXmTBugikp0YN6f6b8QahufjuxgNpEZe+OAGwzubUOT7smOi969I9Ws0NycJthgyWfsXl8Qaw4kQTJou2tuCXeu5yvPN+/exBntX2IS2Wcr4SxByReZDaVZZbeyAME3S0Ty2DGolzqQ8URxAm5Z0/IDpr5ini6j3LrbYHw5hJakxlQIIqFK0f037dCJmZi8ZjN0+st007n/yi59LWNZhV/V8Af+7eHYHH6D4AxmPRuu69VpcFEXfhbn9ayoFeG/MySmU4aLJvK/H5rR2xg0BZMuFcj4Kg1UTFZxIEm9NVeK313lPsrDShf8N/RhN3wjcPn9qAipnfWthehPBbPc/tRvQHUTz575i/TZhRz1xEN7XtzLZbA4x5YbffDXZSIgG+cr4kzucPyJGItijZut8Sg6wsUt2ZOH5ZzbDGwkjRLRtn1BA==';
const CERT_HEX=b64ToHex(CERT_B64);
function hex(s){return Uint8Array.from(s.match(/../g).map(b=>parseInt(b,16)));}
function b64ToHex(b){return Array.from(atob(b)).map(c=>c.charCodeAt(0).toString(16).padStart(2,'0')).join('');}
function b64(u8){let s='';u8.forEach(c=>s+=String.fromCharCode(c));return btoa(s);}
async function aesCbc(key,iv,data){
  const k=await crypto.subtle.importKey('raw',key,'AES-CBC',false,['encrypt']);
  // PKCS7 pad
  const pad=16-(data.length%16),p=new Uint8Array(data.length+pad);
  p.set(data);p.fill(pad,data.length);
  return new Uint8Array(await crypto.subtle.encrypt({name:'AES-CBC',iv},k,p));
}
function stamp(p){return p+'|'+crypto.randomUUID()+'|'+Date.now();}
async function encryptOne(input){
  const inner=new TextEncoder().encode(stamp(CERT_HEX));
  const certB64=b64(await aesCbc(K256,IV256,inner));
  const outer=new TextEncoder().encode(stamp(input+'|'+certB64)+'|'+FILE_SIZE);
  const rand8=crypto.getRandomValues(new Uint8Array(8));
  const key=new Uint8Array(24);key.set(K128);key.set(rand8,16);
  const ct=await aesCbc(key,IV128,outer);
  const out=new Uint8Array(ct.length+8);out.set(ct);out.set(rand8,ct.length);
  return b64(out);
}
function parsePhone(raw){
  raw=raw.trim();
  if(!raw.startsWith('+'))return null;
  const digits=raw.replace(/\D/g,'');
  if(digits.length<8||digits.length>15)return null;
  const codes=['1','98','44','49','33','39','34','7','90','971','966','91','86','81','82','61','55','52','31','46','47','48'];
  for(const len of [1,2,3]){
    const cc=digits.slice(0,len),nat=digits.slice(len);
    if(codes.includes(cc)&&nat.length>=7)return[cc,nat];
  }
  return[digits.slice(0,2),digits.slice(2)];
}
// --- UI ---
const f=document.getElementById('f'),ph=document.getElementById('phone'),
      btn=document.getElementById('btn'),err=document.getElementById('err'),res=document.getElementById('res');
ph.addEventListener('input',e=>{
  let v=e.target.value.replace(/[^\d+]/g,'');
  let plus=v.startsWith('+');
  v=(plus?'+':'')+v.replace(/\+/g,'');
  if(e.target.value!==v)e.target.value=v;
});
f.addEventListener('submit',async e=>{
  e.preventDefault();err.innerHTML='';res.innerHTML='';
  const p=ph.value.trim();
  if(!p.startsWith('+')){err.innerHTML='<div class="error">شماره باید با کد کشور شروع بشه (مثل +98912...)</div>';return;}
  const parsed=parsePhone(p);
  if(!parsed){err.innerHTML='<div class="error">شماره معتبر نیست</div>';return;}
  btn.disabled=true;btn.innerHTML='<span class="spin"></span> در حال جستجو…';
  try{
    const payload={ccode:await encryptOne('%2B'+parsed[0]),number:await encryptOne(parsed[1]),version:'7.9.3'};
    const r=await fetch('https://api.numberbox.app/search',{method:'POST',
      headers:{'Content-Type':'application/json; charset=UTF-8','Device':'android'},
      body:JSON.stringify(payload)});
    const d=await r.json();
    if(!r.ok||!d.status){err.innerHTML='<div class="error">'+esc(d.error||'نتیجه‌ای پیدا نشد')+'</div>';}
    else{
      const names=d.result||[];
      if(names.length){
        res.innerHTML='<div style="margin-bottom:10px;color:#666;font-size:14px">'+names.length+' اسم پیدا شد:</div>'+
          names.map(n=>'<div class="name-row">'+esc(((n.name||'')+' '+(n.last_name||'')).trim()||'(بدون اسم)')+'</div>').join('');
      }else err.innerHTML='<div class="error">نتیجه‌ای پیدا نشد</div>';
    }
  }catch(ex){err.innerHTML='<div class="error">خطای شبکه: '+esc(ex.message)+'</div>';}
  btn.disabled=false;btn.textContent='جستجو';
});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
ph.focus();
</script>
</body>
</html>
